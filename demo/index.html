<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tienda UCJC · Identidad (página propia)</title>
    <style>
      body { margin: 0; padding: 1.5rem; font: 15px/1.45 system-ui, sans-serif; color: #152033; background: #fafafa; }
      main { display: grid; gap: 1.25rem; max-width: 46rem; }
      h1 { margin: 0; font-size: 1.25rem; }
      p { margin: 0; color: #5b677a; }
      pre { margin: 0; padding: .75rem; background: #fff; border: 1px solid #d7dee8; border-radius: 8px; font-size: 12px; white-space: pre-wrap; min-height: 4rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Identidad · página propia</h1>
      <p>Carga el mismo <code>remote.js</code> que usa el shell y muestra los eventos que emite la pieza.</p>
      <ucjc-identidad></ucjc-identidad>
      <section>
        <p>Eventos <code>ucjc:identidad:sesion-cambiada@1</code> recibidos:</p>
        <pre id="log"></pre>
      </section>
    </main>
    <script type="module">
      const log = document.getElementById('log');
      window.addEventListener('ucjc:identidad:sesion-cambiada@1', (e) => {
        log.textContent = JSON.stringify(e.detail, null, 2) + '\n\n' + log.textContent;
      });
      const { default: meta } = await import('./remote.js');
      document.title += ` · v${meta.version}`;
    </script>
  </body>
</html>
